bc_staff.overview:
  path: '/staff'
  options:
    _admin_route: FALSE
  defaults:
    _controller: '\Drupal\bc_staff\Controller\StaffController::overview'
    _title: 'Staff overview'
  requirements:
    _permission: 'view bc staff overview'
bc_staff.my_status:
  path: '/staff/min-status'
  options:
    _admin_route: FALSE
  defaults:
    _form: '\Drupal\bc_staff\Form\MyStatusForm'
    _title: 'My status'
  requirements:
    _permission: 'update own bc staff status'
bc_staff.mobile:
  path: '/staff/mobil'
  options:
    _admin_route: FALSE
  defaults:
    _form: '\Drupal\bc_staff\Form\MyStatusForm'
    _title: 'My status – mobile'
  requirements:
    _permission: 'update own bc staff status'

bc_staff.employee_list:
  path: '/staff/medarbejdere'
  options:
    _admin_route: FALSE
  defaults:
    _controller: '\Drupal\bc_staff\Controller\EmployeeAdminController::listing'
    _title: 'BC Staff employees'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'
bc_staff.employee_add:
  path: '/staff/medarbejdere/ny'
  options:
    _admin_route: FALSE
  defaults:
    _form: '\Drupal\bc_staff\Form\EmployeeForm'
    _title: 'Add employee'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'
bc_staff.employee_edit:
  path: '/staff/medarbejdere/{user}/rediger'
  options:
    _admin_route: FALSE
  defaults:
    _form: '\Drupal\bc_staff\Form\EmployeeForm'
    _title: 'Edit employee'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'
    user: '\d+'

bc_staff.login:
  path: '/staff/login'
  options:
    _admin_route: FALSE
  defaults:
    _controller: '\Drupal\bc_staff\Controller\StaffLoginController::page'
    _title: 'BC Staff login'
  requirements:
    _access: 'TRUE'

bc_staff.organization:
  path: '/staff/organisation'
  options:
    _admin_route: FALSE
  defaults:
    _controller: '\Drupal\bc_staff\Controller\OrganizationController::overview'
    _title: 'Organization'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\OrganizationAccess::access'

bc_staff.organization_add:
  path: '/staff/organisation/{vocabulary}/ny'
  options:
    _admin_route: FALSE
  defaults:
    _form: '\Drupal\bc_staff\Form\OrganizationTermForm'
    _title: 'Add organization entry'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\OrganizationAccess::access'
    vocabulary: 'bc_staff_department|bc_staff_house|bc_staff_location|bc_staff_workgroup'

bc_staff.organization_edit:
  path: '/staff/organisation/{vocabulary}/{term}/rediger'
  options:
    _admin_route: FALSE
  defaults:
    _form: '\Drupal\bc_staff\Form\OrganizationTermForm'
    _title: 'Edit organization entry'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\OrganizationAccess::access'
    vocabulary: 'bc_staff_department|bc_staff_house|bc_staff_location|bc_staff_workgroup'
    term: '\d+'

bc_staff.touch:
  path: '/staff/touch'
  options:
    _admin_route: FALSE
  defaults:
    _form: '\Drupal\bc_staff\Form\TouchCheckInForm'
    _title: 'Check in / Check out'
  requirements:
    _permission: 'update own bc staff status'

bc_staff.managed_touch:
  path: '/staff/touch/team'
  options:
    _admin_route: FALSE
  defaults:
    _form: '\Drupal\bc_staff\Form\ManagedTouchForm'
    _title: 'Team check-in terminal'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'

bc_staff.attendance_history:
  path: '/staff/fremmoede'
  options:
    _admin_route: FALSE
  defaults:
    _controller: '\Drupal\bc_staff\Controller\AttendanceHistoryController::listing'
    _title: 'Attendance and history'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'

bc_staff.my_profile:
  path: '/staff/min-profil'
  options:
    _admin_route: FALSE
  defaults:
    _form: '\Drupal\bc_staff\Form\MyProfileForm'
    _title: 'My profile'
  requirements:
    _user_is_logged_in: 'TRUE'

bc_staff.attendance_report:
  path: '/staff/fremmoede/rapport'
  options:
    _admin_route: FALSE
  defaults:
    _controller: '\Drupal\bc_staff\Controller\AttendanceReportController::listing'
    _title: 'Attendance report'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'

bc_staff.attendance_correction:
  path: '/staff/fremmoede/ret/{attendance}'
  defaults:
    _form: '\Drupal\bc_staff\Form\AttendanceCorrectionForm'
    _title: 'Correct attendance'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'
    attendance: '\d+'

bc_staff.attendance_export:
  path: '/staff/fremmoede/rapport/csv'
  defaults:
    _controller: '\Drupal\bc_staff\Controller\AttendanceReportController::export'
    _title: 'Export attendance'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'
