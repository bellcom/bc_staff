bc_staff.overview:
  path: '/staff'
  defaults:
    _controller: '\Drupal\bc_staff\Controller\StaffController::overview'
    _title: 'Medarbejderoverblik'
  requirements:
    _permission: 'view bc staff overview'
bc_staff.my_status:
  path: '/staff/min-status'
  defaults:
    _form: '\Drupal\bc_staff\Form\MyStatusForm'
    _title: 'Min status'
  requirements:
    _permission: 'update own bc staff status'
bc_staff.mobile:
  path: '/staff/mobil'
  defaults:
    _form: '\Drupal\bc_staff\Form\MyStatusForm'
    _title: 'Min status – mobil'
  requirements:
    _permission: 'update own bc staff status'

bc_staff.employee_list:
  path: '/admin/bc-staff/employees'
  defaults:
    _controller: '\Drupal\bc_staff\Controller\EmployeeAdminController::listing'
    _title: 'BC Staff – medarbejdere'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'
bc_staff.employee_add:
  path: '/admin/bc-staff/employees/add'
  defaults:
    _form: '\Drupal\bc_staff\Form\EmployeeForm'
    _title: 'Opret medarbejder'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'
bc_staff.employee_edit:
  path: '/admin/bc-staff/employees/{user}/edit'
  defaults:
    _form: '\Drupal\bc_staff\Form\EmployeeForm'
    _title: 'Rediger medarbejder'
  requirements:
    _custom_access: '\Drupal\bc_staff\Access\EmployeeAccess::access'
    user: '\d+'
