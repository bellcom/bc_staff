services:
  bc_staff.mobile_login_redirect:
    class: Drupal\bc_staff\EventSubscriber\MobileLoginRedirectSubscriber
    arguments: ['@current_user']
    tags:
      - { name: event_subscriber }
  bc_staff.theme_negotiator:
    class: Drupal\bc_staff\Theme\StaffThemeNegotiator
    arguments: ['@theme_handler']
    tags:
      - { name: theme_negotiator, priority: 1000 }
