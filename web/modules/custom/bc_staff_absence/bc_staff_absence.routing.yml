bc_staff_absence.list:
  path: '/staff/fravaer'
  defaults:
    _controller: '\Drupal\bc_staff_absence\Controller\AbsenceController::listing'
    _title: 'My absence'
  requirements:
    _user_is_logged_in: 'TRUE'

bc_staff_absence.add:
  path: '/staff/fravaer/ny'
  defaults:
    _form: '\Drupal\bc_staff_absence\Form\AbsenceForm'
    _title: 'Register absence'
  requirements:
    _user_is_logged_in: 'TRUE'

bc_staff_absence.review:
  path: '/staff/fravaer/godkend'
  defaults:
    _controller: '\Drupal\bc_staff_absence\Controller\AbsenceController::review'
    _title: 'Absence requests'
  requirements:
    _permission: 'manage own bc staff department+manage all bc staff absences'

bc_staff_absence.calendar:
  path: '/staff/kalender'
  defaults:
    _controller: '\Drupal\bc_staff_absence\Controller\AbsenceCalendarController::calendar'
    _title: 'Team calendar'
  requirements:
    _permission: 'manage own bc staff department+manage all bc staff absences'

bc_staff_absence.cancel:
  path: '/staff/fravaer/{absence}/annuller'
  defaults:
    _form: '\Drupal\bc_staff_absence\Form\AbsenceCancelForm'
    _title: 'Withdraw request'
  requirements:
    _user_is_logged_in: 'TRUE'
    absence: '\d+'

bc_staff_absence.edit:
  path: '/staff/fravaer/{absence}/rediger'
  defaults:
    _form: '\Drupal\bc_staff_absence\Form\AbsenceForm'
    _title: 'Edit request'
  requirements:
    _user_is_logged_in: 'TRUE'
    absence: '\d+'

bc_staff_absence.approved_change:
  path: '/staff/fravaer/{absence}/aendring'
  defaults:
    _form: '\Drupal\bc_staff_absence\Form\ApprovedVacationChangeForm'
    _title: 'Request vacation change'
  requirements:
    _user_is_logged_in: 'TRUE'
    absence: '\d+'
